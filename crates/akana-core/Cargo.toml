[package]
name = "akana-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Core Rust library for Akana Turkish NLP toolkit"

[dependencies]
stringzilla = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ahash = { workspace = true }
bitflags = { version = "2.4", features = ["serde"] }
smallvec = { workspace = true }
thiserror = { workspace = true }
lazy_static = { workspace = true }
flate2 = { workspace = true }
unicode-normalization = { workspace = true }
rten = { version = "0.27.0", optional = true }
unicode_categories = { version = "0.1.1", optional = true }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "0.10.9", optional = true }

[features]
# The learned PII tagger (pii::tagger): ONNX token classifiers run with RTen, a pure-Rust CPU runtime.
pii-tagger = ["dep:rten", "dep:unicode_categories"]
# The tagger's published models, downloaded on first use and cached (pii::tagger::hub).
pii-download = ["pii-tagger", "dep:ureq", "dep:sha2"]

[dev-dependencies]
criterion = "0.5"
